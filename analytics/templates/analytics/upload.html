<!DOCTYPE html>
<html>
<head>
    <title>InsightPulse - Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm p-4">
            <h3 class="mb-3 text-center">InsightPulse Data Ingestion</h3>
            <p class="text-muted text-center small">Upload a CSV dataset with numeric metrics (e.g., Spend, Orders, Age) to run automated segmentation & AI analysis.</p>
            
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Project / Dataset Title</label>
                    {{ form.title }}
                </div>
                <div class="mb-3">
                    <label class="form-label">CSV File</label>
                    {{ form.file }}
                </div>
                <button type="submit" class="btn btn-primary w-100">Run ML & Generate Insights</button>
            </form>
        </div>
    </div>
</body>
</html>
